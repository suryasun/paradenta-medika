components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: "Only endpoint-specific allowed fields are honored; an unlisted field falls back to createdAt."
      schema: { type: string, default: createdAt }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VisitId:
      name: visitId
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    GenericJson:
      required: true
      content:
        application/json:
          schema: { type: object }

  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: {}
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    DateCountPoint:
      type: object
      properties:
        date: { type: string, format: date }
        count: { type: integer }
    ApiErrorEnvelope:
      type: object
      required: [success, code, message, errors]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        correlationId: { type: string, format: uuid }

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
    Created:
      description: Resource created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
    PagedOk:
      description: Paginated list
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
    DashboardOk:
      description: Dashboard metrics (docs/03-sad/20-module-report.md Section 6.1 response envelope)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      scope:
                        type: object
                        properties:
                          branchIds: { type: array, items: { type: string, format: uuid } }
                          timezone: { type: string, example: "Asia/Jakarta" }
                      dataAsOf: { type: string, format: date-time }
                      freshness: { type: string, enum: [fresh, partial] }
                      definitionVersion: { type: string, example: "1.0.0" }
                      metrics:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string, example: "finance.posted-revenue" }
                            value: { type: number }
                            currency: { type: string, example: "IDR" }
    ValidationError:
      description: Request failed DTO validation (class-validator, whitelist + forbidNonWhitelisted)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    Unauthorized:
      description: Missing, invalid, expired, or revoked token / inactive user (AUTH-080..084)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    Forbidden:
      description: Authenticated but missing the required permission (AUTH-085)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    Conflict:
      description: Resource conflict (e.g. duplicate identifier)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    BusinessRuleViolation:
      description: Business rule violation (state-machine or domain validation failure)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
