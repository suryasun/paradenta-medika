  # ---------------------------------------------------------------------
  # Reservation (docs/06-tasks/task-002.md, task-031.md..task-036.md)
  # ---------------------------------------------------------------------
  /reservations:
    get:
      tags: [Reservation]
      summary: List / search reservations
      x-permission: reservation.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - name: reservationType
          in: query
          schema: { type: string }
        - name: reservationSource
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Reservation]
      summary: Create reservation (scheduled) or walk-in registration
      description: >
        A single endpoint backs both flows: WALK_IN is dispatched to
        WalkInRegistrationUseCase when source or reservationType is
        "WALK_IN" (no date/time required); otherwise CreateReservationUseCase
        handles a scheduled appointment.
      x-permission: reservation.create
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: "Double-booking or same-patient-same-day conflict", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # docs/06-tasks/task-060.md (Epic K). Registered before /reservations/{id}
  # so Express doesn't match "analytics" as the :id param.
  /reservations/analytics:
    get:
      tags: [Reservation]
      summary: Reservation analytics dashboard (trend, peak hours, doctor utilization, conversion, walk-in ratio, cancellation/no-show trend, KPIs)
      x-permission: reservation.analytics.read
      parameters:
        - name: dateFrom
          in: query
          description: Defaults to 30 days before dateTo when omitted (not a literal SAD default).
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: Defaults to today when omitted (not a literal SAD default).
          schema: { type: string, format: date }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Analytics computed for the requested date range
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dateRange:
                            type: object
                            properties: { from: { type: string, format: date }, to: { type: string, format: date } }
                          reservationTrend: { type: array, items: { $ref: '#/components/schemas/DateCountPoint' } }
                          peakHourAnalysis:
                            type: array
                            items:
                              type: object
                              properties: { hour: { type: integer }, count: { type: integer } }
                          doctorUtilization:
                            type: array
                            items:
                              type: object
                              properties: { doctorId: { type: string, format: uuid }, count: { type: integer } }
                          appointmentConversion:
                            type: object
                            properties: { totalCount: { type: integer }, completedCount: { type: integer }, conversionRate: { type: number } }
                          walkinRatio:
                            type: object
                            properties: { walkinCount: { type: integer }, totalCount: { type: integer }, ratio: { type: number } }
                          cancellationTrend: { type: array, items: { $ref: '#/components/schemas/DateCountPoint' } }
                          noShowTrend: { type: array, items: { $ref: '#/components/schemas/DateCountPoint' } }
                          kpi:
                            type: object
                            properties:
                              totalReservations: { type: integer }
                              dailyReservations: { type: integer }
                              weeklyReservations: { type: integer }
                              monthlyReservations: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }

  /reservations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Reservation]
      summary: Reservation detail
      x-permission: reservation.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reservation]
      summary: Update reservation
      x-permission: reservation.update
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{id}/reschedule:
    patch:
      tags: [Reservation]
      summary: Reschedule to a new date/time
      x-permission: reservation.reschedule
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{id}/cancel:
    patch:
      tags: [Reservation]
      summary: Cancel reservation
      x-permission: reservation.cancel
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{id}/check-in:
    patch:
      tags: [Reservation]
      summary: Check in patient (publishes PatientCheckedIn -> auto-creates Queue entry)
      x-permission: reservation.check-in
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /doctors/{id}/availability:
    get:
      tags: [Reservation]
      summary: Doctor availability for a date
      x-permission: reservation.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /doctors/{id}/time-slots:
    get:
      tags: [Reservation]
      summary: Bookable time slots for a doctor on a date
      x-permission: reservation.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # Queue (docs/06-tasks/task-037.md..task-047.md)
  # ---------------------------------------------------------------------
  /queues/dashboard:
    get:
      tags: [Queue]
      summary: Queue dashboard (status/doctor summary, wait/service time)
      x-permission: queue.dashboard.read
      parameters:
        - name: branchId
          in: query
