openapi: 3.0.3
info:
  title: Parakita API
  description: >
    Dental Clinic Management System — Phase 1 (Foundation/MVP) + Phase 2
    (Core Clinical Operations) + Phase 3 (Operational Excellence: Warehouse,
    Finance, Advanced Reporting, System Ops) + Phase 4 (Multi Branch
    Platform, task-210-225). Generated from the actual implemented
    routes/DTOs under src/modules/*/presentation, not hand-invented — every
    path, permission code, and status code here mirrors the corresponding
    *.routes.ts file. See docs/06-tasks/phase-1-documentation/ for the
    Phase 1 per-epic build record; Phase 2 covers Epic K-U (task-060-094);
    Phase 3 covers Epic V-AL (task-095-209); Phase 4 covers Epic BA-BH
    (task-210-225): Branch Assignment, Default Branch Policy, Centralized
    User Management, Branch-Level Access Control, Branch Dashboard, Cross
    Branch Reporting, Branch Performance Monitoring, Centralized Master
    Data, and Branch Synchronization. Every Phase 4 endpoint path not
    literally enumerated in its module's SAD Section 6 table is
    convention-derived (documented per-endpoint in each task's own
    Definition of Done) rather than invented.
  # Minor bump only: each phase is purely additive (new endpoints/optional
  # fields), no breaking change per API-006 -- the API route version stays
  # /api/v1 (API-004).
  version: 1.2.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: System - Users
  - name: System - Roles
  - name: Master Data - Clinics
  - name: Master Data - Branches
  - name: Master Data - Doctors
  - name: Master Data - Treatment Categories
  - name: Master Data - Treatments
  - name: Master Data - Payment Methods
  - name: Master Data - Tooth Conditions
  - name: Master Data - Consent Templates
  - name: Patient
  - name: Reservation
  - name: Queue
  - name: EMR
  - name: Billing
  - name: Reports
  - name: Warehouse
  - name: Finance
  - name: Master Data - Templates

paths:
  # ---------------------------------------------------------------------
  # Auth (docs/06-tasks/task-007.md..task-014.md)
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with username/email + password
      security: []
      x-rate-limit: "5/min"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: "username or email" }
                password: { type: string, format: password }
                deviceName: { type: string }
                deviceType: { type: string }
                deviceId: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          expiresIn: { type: integer }
                          user:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              username: { type: string }
                              email: { type: string, format: email }
                          role: { type: string }
                          roles: { type: array, items: { type: string } }
                          permissions: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Invalid credentials (generic message, per AUTH-044)", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate access + refresh token
      security: []
      x-rate-limit: "20/min"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          expiresIn: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and its refresh token
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (revokes all other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a single-use, expiring password-reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
      responses:
        '200': { description: "Generic acknowledgement (does not reveal whether the identifier exists)", content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' } } } }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a valid reset token (revokes all sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------------
  # System - Users (docs/06-tasks/task-015.md, task-016.md, task-019.md, task-020.md)
  # ---------------------------------------------------------------------
  /system/users:
    get:
      tags: [System - Users]
      summary: List users
      description: >
        docs/06-tasks/task-214.md: an unfiltered request from a cross-branch
        role (Owner/Administrator/Security Admin, Role.isCrossBranch) returns
        every user across every branch; an unfiltered request from any other
        role is automatically intersected with the requester's own branch
        assignment(s) -- never silently widened. An explicit branchId is
        honoured only when it falls within a non-cross-branch requester's
        own assignments.
      x-permission: system.user.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [System - Users]
      summary: Create user
      x-permission: system.user.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [System - Users]
      summary: User detail
      x-permission: system.user.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [System - Users]
      summary: Update user
      x-permission: system.user.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/activate:
    post:
      tags: [System - Users]
      summary: Reactivate a deactivated user
      x-permission: system.user.activate
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/deactivate:
    post:
      tags: [System - Users]
      summary: Deactivate a user (revokes active sessions)
      x-permission: system.user.deactivate
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/roles:
    post:
      tags: [System - Users]
      summary: Assign one or more roles to a user
      x-permission: system.user.role.manage
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/revoke-sessions:
    post:
      tags: [System - Users]
      summary: Administrator force-logout (all devices, one device, or all sessions)
      x-permission: system.user.session.revoke
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string, format: uuid, description: "omit to revoke all sessions" }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # System - Multi Branch Platform (Phase 4, Epic BA, docs/06-tasks/
  # task-210.md/task-211.md). Every branchAssignments POST replaces the
  # user's full branch-assignment set (not additive).
  # ---------------------------------------------------------------------
  /system/users/{userId}/branches:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post:
      tags: [System - Users]
      summary: Replace a user's branch assignments (exactly one must be isDefault)
      x-permission: system.user.branch.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchAssignments]
              properties:
                branchAssignments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [branchId, isDefault]
                    properties:
                      branchId: { type: string, format: uuid }
                      isDefault: { type: boolean }
                      effectiveFrom: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "SYS_SELF_ESCALATION_FORBIDDEN -- a user cannot change their own branch assignments", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "SYS_BRANCH_SCOPE_INVALID -- non-existent/inactive branch, zero or more than one isDefault, or a duplicate branchId", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
    get:
      tags: [System - Users]
      summary: List a user's branch assignments
      description: "docs/06-tasks/task-211.md: a user can always read their own branch list regardless of system.user.read."
      x-permission: system.user.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # System - Roles (docs/06-tasks/task-017.md, task-018.md)
  # ---------------------------------------------------------------------
  /system/roles:
    get:
      tags: [System - Roles]
      summary: List roles
      x-permission: system.role.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [System - Roles]
      summary: Create role
      x-permission: system.role.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCode, roleName]
              properties:
                roleCode: { type: string }
                roleName: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/permissions:
    get:
      tags: [System - Roles]
      summary: List all permission codes
      x-permission: system.permission.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }

  /system/roles/{roleId}/permissions:
    patch:
      tags: [System - Roles]
      summary: Replace a role's permission set
      x-permission: system.role.permission.manage
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # docs/06-tasks/task-215.md (Phase 4 Epic BB). Convention-derived path,
  # not literal in the SAD's Section 6.1 table.
  /system/roles/branch-matrix:
    get:
      tags: [System - Roles]
      summary: Role x branch x user-count aggregation, reflecting concurrent multi-branch assignments
      x-permission: system.role.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # docs/06-tasks/task-217.md (Phase 4 Epic BC). Convention-derived path.
  /system/roles/{roleId}/branch-policy:
    patch:
      tags: [System - Roles]
      summary: Flip a role's cross-branch policy (bypasses task-216's BranchScopeGuard when true)
      x-permission: system.role.branch-policy.manage
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isCrossBranch]
              properties:
                isCrossBranch: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "SYS_ROLE_SYSTEM_PROTECTED -- built-in roles (isSystem=true) cannot have their branch policy changed", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # docs/06-tasks/task-213.md (Phase 4 Epic BA). Convention-derived path,
  # not literal in the SAD's Section 6.2 table.
  /system/branches/{branchId}/configuration:
    get:
      tags: [System - Roles]
      summary: A branch's full effective configuration -- every branch-level System Parameter override, plus every inherited clinic-level (GLOBAL) default not overridden at branch level
      x-permission: system.parameter.read
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "Array of { key, value, valueType, source: BRANCH|GLOBAL }, distinguishing overrides from inherited defaults"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # System - Audit Dashboard (docs/06-tasks/task-192.md/task-193.md, Epic
  # AI). No update/delete route exists for audit_logs anywhere in this
  # codebase, so SYS_AUDIT_IMMUTABLE is satisfied structurally. task-194
  # (Operations Health Dashboard) is deferred: it depends on the
  # background_jobs/job_logs registry, which is Epic AL's own future
  # deliverable (task-207), not yet built.
  # ---------------------------------------------------------------------
  /system/audit-logs:
    get:
      tags: [System]
      summary: "Query the compliance-grade audit log (UC-SYS-006); the query itself is recorded as an audit event"
      x-permission: system.audit.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }

  /system/activity-logs:
    get:
      tags: [System]
      summary: "Query the lighter-weight, user-facing activity timeline (distinct from audit-logs)"
      x-permission: system.activity.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
        - { name: module, in: query, schema: { type: string } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }

  # ---------------------------------------------------------------------
  # System - Notification Center (docs/06-tasks/task-195.md..task-198.md,
  # Epic AJ). task-199 (SendNotificationUseCase) is an internal service
  # with no public endpoint of its own -- not listed here.
  # ---------------------------------------------------------------------
  /system/notification-templates:
    get:
      tags: [System]
      summary: List notification templates (all versions)
      x-permission: system.notification-template.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: templateKey, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string, enum: [EMAIL, SMS, IN_APP] } }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [System]
      summary: "Create a notification template (immutable after published -- creates a new version)"
      x-permission: system.notification-template.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateKey, channel, locale, body, variableSchema]
              properties:
                templateKey: { type: string, example: "reservation.reminder" }
                channel: { type: string, enum: [EMAIL, SMS, IN_APP] }
                locale: { type: string, example: "id-ID" }
                subject: { type: string }
                body: { type: string, example: "Hi {{patientName}}, your appointment is on {{date}}." }
                variableSchema: { type: array, items: { type: string } }
                classification: { type: string, example: "internal" }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "SYS_TEMPLATE_CONTENT_UNSAFE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /system/notification-templates/{templateId}/preview:
    post:
      tags: [System]
      summary: "Render a template against preview data (never sends a real notification)"
      x-permission: system.notification-template.manage
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "SYS_TEMPLATE_VARIABLE_MISSING", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /system/notifications:
    get:
      tags: [System]
      summary: "List the authenticated user's own notification inbox"
      x-permission: system.notification.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string, enum: [QUEUED, PROCESSING, SENT, DELIVERED, FAILED, READ, CANCELLED] } }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }

  /system/notifications/{notificationId}/read:
    post:
      tags: [System]
      summary: Mark one of the authenticated user's own notifications as read
      x-permission: system.notification.read
      parameters: [{ name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: "SYS_NOTIFICATION_NOT_OWNED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # System - Approval Workflow (docs/06-tasks/task-200.md..task-206.md,
  # Epic AK, UC-SYS-003/UC-SYS-004). No literal Section 6.4-style
  # permission table exists for these endpoints -- extrapolated
  # `system.parameter.*`/`system.config-request.*`/`system.feature-flag.*`/
  # `system.menu.*` names.
  # ---------------------------------------------------------------------
  /system/parameters:
    get:
      tags: [System]
      summary: List system parameters (latest and historical versions)
      x-permission: system.parameter.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: key, in: query, schema: { type: string } }
        - { name: scopeType, in: query, schema: { type: string, enum: [GLOBAL, BRANCH] } }
        - { name: scopeId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [System]
      summary: "Create a system parameter (append-only versioned; secret values must be a secret reference)"
      x-permission: system.parameter.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, valueType, value]
              properties:
                key: { type: string, example: "warehouse.expiry.warning_days" }
                scope:
                  type: object
                  properties:
                    type: { type: string, enum: [global, branch] }
                    id: { type: string, format: uuid }
                valueType: { type: string, enum: [STRING, INTEGER, DECIMAL, BOOLEAN, ENUM, DATE, DURATION, JSON, SECRET_REF] }
                value: {}
                effectiveFrom: { type: string, format: date-time }
                isHighRisk: { type: boolean }
                reason: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "SYS_CONFIG_SCHEMA_INVALID / SYS_SECRET_VALUE_FORBIDDEN", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /system/parameters/{parameterKey}/versions:
    get:
      tags: [System]
      summary: "Immutable version history of a parameter (strictly ordered, never edited)"
      x-permission: system.parameter.read
      parameters:
        - { name: parameterKey, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }

  /system/parameters/{parameterKey}/change-requests:
    post:
      tags: [System]
      summary: "Propose a new parameter value (UC-SYS-003 'High risk?' branch -- requires independent approval before it activates)"
      x-permission: system.config-request.create
      parameters: [{ name: parameterKey, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valueType, value]
              properties:
                scope:
                  type: object
                  properties:
                    type: { type: string, enum: [global, branch] }
                    id: { type: string, format: uuid }
                valueType: { type: string, enum: [STRING, INTEGER, DECIMAL, BOOLEAN, ENUM, DATE, DURATION, JSON, SECRET_REF] }
                value: {}
                reason: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: "SYS_CONFIG_VERSION_CONFLICT -- an equivalent pending proposal already exists", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "SYS_CONFIG_SCHEMA_INVALID / SYS_SECRET_VALUE_FORBIDDEN", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /system/configuration-change-requests/{requestId}/approve:
    post:
      tags: [System]
      summary: "Approve a pending change request (independent approver required), activating a new parameter version and publishing system.configuration.changed.v1"
      x-permission: system.config-request.approve
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: "SYS_CONFIG_APPROVAL_REQUIRED -- the requester cannot also approve", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/parameters/{parameterKey}/rollback:
    post:
      tags: [System]
      summary: "Roll back to a previously validated version (creates a new pending change request from that version's value; same approval gate as a normal proposal)"
      x-permission: system.config-request.create
      parameters: [{ name: parameterKey, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                scope:
                  type: object
                  properties:
                    type: { type: string, enum: [global, branch] }
                    id: { type: string, format: uuid }
                version: { type: integer }
                reason: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "SYS_CONFIG_VERSION_CONFLICT", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

