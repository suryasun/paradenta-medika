              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_PERIOD_INVALID_STATUS -- must be closed", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

