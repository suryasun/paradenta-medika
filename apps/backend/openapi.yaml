  # ---------------------------------------------------------------------
  # Master Data - Templates (Phase 4, Epic BG, docs/06-tasks/task-221.md/
  # task-222.md/task-223.md). No literal Section 6 API spec exists for
  # Master Data (unlike Warehouse/Finance) -- paths are convention-derived.
  # ---------------------------------------------------------------------
  /masterdata/templates:
    get:
      tags: [Master Data - Templates]
      summary: List Head-Office reference-data templates
      x-permission: masterdata.template.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Templates]
      summary: Create a reference-data template (version starts at 1)
      x-permission: masterdata.template.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityType, templatePayload, ownerClinicId]
              properties:
                entityType: { type: string, example: "TREATMENT" }
                templatePayload: { type: object }
                ownerClinicId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /masterdata/templates/{templateId}:
    parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Master Data - Templates]
      summary: Template detail
      x-permission: masterdata.template.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Templates]
      summary: Update a template's payload (auto-increments version so already-synced branches can be diffed)
      x-permission: masterdata.template.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templatePayload: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /masterdata/templates/{templateId}/push:
    post:
      tags: [Master Data - Templates]
      summary: Push a template to one or more branches (create-if-absent, update-if-undiverged, flag-if-diverged)
      description: >
        docs/06-tasks/task-222.md: for each target branchId, creates the
        branch-scoped link if absent, or updates it if the branch's live
        copy hasn't diverged from what was last pushed. A branch whose live
        copy has locally diverged since the last push is flagged CONFLICT
        and left untouched rather than silently overwritten; one
        conflicting branch does not block the push to the other requested
        branches.
      x-permission: masterdata.template.manage
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchIds]
              properties:
                branchIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
      responses:
        '200':
          description: "Array of { branchId, status: CREATED|UPDATED|CONFLICT }, one entry per requested branchId"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: "Template or one of the requested branches does not exist", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /masterdata/templates/{templateId}/drift:
    get:
      tags: [Master Data - Templates]
      summary: Field-by-field divergence report for every branch this template has been pushed to
      description: "docs/06-tasks/task-223.md: compares each pushed branch's live copy against what was pushed (not just a boolean); also flags a branch as stale when the template has been updated since that branch's last push."
      x-permission: masterdata.template.manage
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: "Array of { branchId, pushedVersion, isStale, fieldDrifts: [{ field, pushedValue, currentValue }] }"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

