openapi: 3.0.3
info:
  title: Parakita API
  description: >
    Dental Clinic Management System — Phase 1 (Foundation/MVP) + Phase 2
    (Core Clinical Operations). Generated from the actual implemented
    routes/DTOs under src/modules/*/presentation, not hand-invented — every
    path, permission code, and status code here mirrors the corresponding
    *.routes.ts file. See docs/06-tasks/phase-1-documentation/ for the
    Phase 1 per-epic build record; Phase 2 covers Epic K-U (task-060-094):
    Appointment Analytics, Medical History/Allergy, Odontogram, Treatment
    Planning, Prescription, Periodontal Assessment, Clinical Attachment,
    Consent, Referral/Follow Up, Medical Certificate, and Clinical Timeline.
  # Minor bump only: Phase 2 is purely additive (new endpoints/optional
  # fields), no breaking change per API-006 -- the API route version stays
  # /api/v1 (API-004).
  version: 1.1.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: System - Users
  - name: System - Roles
  - name: Master Data - Clinics
  - name: Master Data - Branches
  - name: Master Data - Doctors
  - name: Master Data - Treatment Categories
  - name: Master Data - Treatments
  - name: Master Data - Payment Methods
  - name: Master Data - Tooth Conditions
  - name: Master Data - Consent Templates
  - name: Patient
  - name: Reservation
  - name: Queue
  - name: EMR
  - name: Billing
  - name: Reports
  - name: Warehouse

paths:
  # ---------------------------------------------------------------------
  # Auth (docs/06-tasks/task-007.md..task-014.md)
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with username/email + password
      security: []
      x-rate-limit: "5/min"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: "username or email" }
                password: { type: string, format: password }
                deviceName: { type: string }
                deviceType: { type: string }
                deviceId: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          expiresIn: { type: integer }
                          user:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              username: { type: string }
                              email: { type: string, format: email }
                          role: { type: string }
                          roles: { type: array, items: { type: string } }
                          permissions: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Invalid credentials (generic message, per AUTH-044)", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate access + refresh token
      security: []
      x-rate-limit: "20/min"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          expiresIn: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and its refresh token
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (revokes all other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a single-use, expiring password-reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
      responses:
        '200': { description: "Generic acknowledgement (does not reveal whether the identifier exists)", content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' } } } }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a valid reset token (revokes all sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------------
  # System - Users (docs/06-tasks/task-015.md, task-016.md, task-019.md, task-020.md)
  # ---------------------------------------------------------------------
  /system/users:
    get:
      tags: [System - Users]
      summary: List users
      x-permission: system.user.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [System - Users]
      summary: Create user
      x-permission: system.user.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [System - Users]
      summary: User detail
      x-permission: system.user.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [System - Users]
      summary: Update user
      x-permission: system.user.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/activate:
    post:
      tags: [System - Users]
      summary: Reactivate a deactivated user
      x-permission: system.user.activate
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/deactivate:
    post:
      tags: [System - Users]
      summary: Deactivate a user (revokes active sessions)
      x-permission: system.user.deactivate
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/roles:
    post:
      tags: [System - Users]
      summary: Assign one or more roles to a user
      x-permission: system.user.role.manage
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/users/{userId}/revoke-sessions:
    post:
      tags: [System - Users]
      summary: Administrator force-logout (all devices, one device, or all sessions)
      x-permission: system.user.session.revoke
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string, format: uuid, description: "omit to revoke all sessions" }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # System - Roles (docs/06-tasks/task-017.md, task-018.md)
  # ---------------------------------------------------------------------
  /system/roles:
    get:
      tags: [System - Roles]
      summary: List roles
      x-permission: system.role.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [System - Roles]
      summary: Create role
      x-permission: system.role.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCode, roleName]
              properties:
                roleCode: { type: string }
                roleName: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/permissions:
    get:
      tags: [System - Roles]
      summary: List all permission codes
      x-permission: system.permission.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }

  /system/roles/{roleId}/permissions:
    patch:
      tags: [System - Roles]
      summary: Replace a role's permission set
      x-permission: system.role.permission.manage
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Master Data (docs/06-tasks/task-021.md..task-026.md) — six identically
  # shaped CRUD resources (crudUseCaseFactory), documented once per resource.
  # ---------------------------------------------------------------------
  /clinics:
    get:
      tags: [Master Data - Clinics]
      summary: List clinics
      x-permission: masterdata.clinic.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Clinics]
      summary: Create clinic
      x-permission: masterdata.clinic.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /clinics/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Clinics]
      summary: Clinic detail
      x-permission: masterdata.clinic.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Clinics]
      summary: Update clinic
      x-permission: masterdata.clinic.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /branches:
    get:
      tags: [Master Data - Branches]
      summary: List branches
      x-permission: masterdata.branch.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Branches]
      summary: Create branch
      x-permission: masterdata.branch.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /branches/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Branches]
      summary: Branch detail
      x-permission: masterdata.branch.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Branches]
      summary: Update branch
      x-permission: masterdata.branch.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /doctors:
    get:
      tags: [Master Data - Doctors]
      summary: List doctors
      x-permission: masterdata.doctor.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Doctors]
      summary: Create doctor
      x-permission: masterdata.doctor.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /doctors/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Doctors]
      summary: Doctor detail
      x-permission: masterdata.doctor.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Doctors]
      summary: Update doctor
      x-permission: masterdata.doctor.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /treatment-categories:
    get:
      tags: [Master Data - Treatment Categories]
      summary: List treatment categories
      x-permission: masterdata.treatment-category.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Treatment Categories]
      summary: Create treatment category
      x-permission: masterdata.treatment-category.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /treatment-categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Treatment Categories]
      summary: Treatment category detail
      x-permission: masterdata.treatment-category.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Treatment Categories]
      summary: Update treatment category
      x-permission: masterdata.treatment-category.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /treatments:
    get:
      tags: [Master Data - Treatments]
      summary: List treatments
      x-permission: masterdata.treatment.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Treatments]
      summary: Create treatment
      x-permission: masterdata.treatment.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /treatments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Treatments]
      summary: Treatment detail
      x-permission: masterdata.treatment.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Treatments]
      summary: Update treatment (e.g. deactivate via isActive)
      x-permission: masterdata.treatment.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payment-methods:
    get:
      tags: [Master Data - Payment Methods]
      summary: List payment methods
      x-permission: masterdata.payment-method.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Payment Methods]
      summary: Create payment method
      x-permission: masterdata.payment-method.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /payment-methods/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Payment Methods]
      summary: Payment method detail
      x-permission: masterdata.payment-method.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Payment Methods]
      summary: Update payment method (e.g. deactivate via isActive)
      x-permission: masterdata.payment-method.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Master Data - Tooth Conditions (docs/06-tasks/task-067.md, Epic O)
  # ---------------------------------------------------------------------
  /tooth-conditions:
    get:
      tags: [Master Data - Tooth Conditions]
      summary: List tooth conditions
      x-permission: masterdata.tooth-condition.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Tooth Conditions]
      summary: Create tooth condition
      x-permission: masterdata.tooth-condition.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conditionCode, conditionName, category]
              properties:
                conditionCode: { type: string, minLength: 2, maxLength: 30 }
                conditionName: { type: string, minLength: 2, maxLength: 100 }
                category: { type: string, enum: [HEALTHY, DISEASE, RESTORATION, PROSTHODONTIC, ENDODONTIC, SURGICAL, ORTHODONTIC, IMPLANTOLOGY] }
                colorCode: { type: string, maxLength: 20 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tooth-conditions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Tooth Conditions]
      summary: Tooth condition detail
      x-permission: masterdata.tooth-condition.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Tooth Conditions]
      summary: Update tooth condition (e.g. deactivate via isActive)
      x-permission: masterdata.tooth-condition.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conditionName: { type: string, minLength: 2, maxLength: 100 }
                category: { type: string, enum: [HEALTHY, DISEASE, RESTORATION, PROSTHODONTIC, ENDODONTIC, SURGICAL, ORTHODONTIC, IMPLANTOLOGY] }
                colorCode: { type: string, maxLength: 20 }
                isActive: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Master Data - Consent Templates (docs/06-tasks/task-085.md, Epic R)
  # Registered inside emr.routes.ts (permission codes are emr.* since
  # Consent is an EMR-owned catalog), tagged as Master Data here to match
  # this spec's per-resource tag granularity for other catalog CRUD.
  # ---------------------------------------------------------------------
  /consent-templates:
    get:
      tags: [Master Data - Consent Templates]
      summary: List consent templates
      x-permission: emr.consent-template.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Consent Templates]
      summary: Create consent template
      x-permission: emr.consent-template.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, title, body]
              properties:
                category: { type: string, enum: [GENERAL, CLINICAL, SURGICAL] }
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1 }
      responses:
