      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /queues/{id}/call:
    patch:
      tags: [Queue]
      summary: Call the next queue entry (WAITING -> CALLED)
      x-permission: queue.call
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/recall:
    patch:
      tags: [Queue]
      summary: Recall (repeat) a CALLED entry's announcement
      x-permission: queue.recall
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /queues/{id}/skip:
    patch:
      tags: [Queue]
      summary: Skip a CALLED entry (CALLED -> SKIPPED)
      x-permission: queue.skip
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/start:
    patch:
      tags: [Queue]
      summary: Start service (CALLED -> IN_SERVICE)
      x-permission: queue.start
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/complete:
    patch:
      tags: [Queue]
      summary: Complete service (IN_SERVICE -> COMPLETED)
      x-permission: queue.complete
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/cancel:
    patch:
      tags: [Queue]
      summary: Cancel a queue entry
      x-permission: queue.cancel
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/transfer:
    patch:
      tags: [Queue]
      summary: Transfer a queue entry to a different doctor
      x-permission: queue.transfer
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId]
              properties:
                doctorId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # EMR (docs/06-tasks/task-048.md..task-053.md)
  # ---------------------------------------------------------------------
  /emr/visits:
    post:
      tags: [EMR]
      summary: Open a Visit from a CALLED Queue entry
      x-permission: emr.visit.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queueId]
              properties:
                queueId: { type: string, format: uuid }
                chiefComplaint: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}:
    get:
      tags: [EMR]
      summary: Visit detail (with vital signs, SOAP, diagnoses, treatments)
      x-permission: emr.visit.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/visits/{id}/vital-signs:
    post:
      tags: [EMR]
      summary: Record vital signs (Visit must be open)
      x-permission: emr.vital.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/soap-note:
    put:
      tags: [EMR]
      summary: Upsert the Visit's SOAP note (Subjective/Objective/Assessment/Plan)
      x-permission: emr.soap.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjective: { type: string }
                objective: { type: string }
                assessment: { type: string }
                plan: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/diagnoses:
    post:
      tags: [EMR]
      summary: Record diagnosis entries (>=1 PRIMARY required)
      x-permission: emr.diagnosis.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diagnoses]
              properties:
                diagnoses:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [diagnosisType, diagnosisName]
                    properties:
                      diagnosisType: { type: string, enum: [PRIMARY, SECONDARY, DIFFERENTIAL] }
                      diagnosisName: { type: string }
                      notes: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/treatments:
    post:
      tags: [EMR]
      summary: Record a Treatment entry (price snapshotted from catalog at entry time)
      x-permission: emr.treatment.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [treatmentId]
              properties:
                treatmentId: { type: string, format: uuid }
                toothReference: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
                notes: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/close:
    post:
      tags: [EMR]
      summary: Close Visit (requires complete SOAP + >=1 Treatment; publishes EMRFinished)
      x-permission: emr.visit.close
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  # ---------------------------------------------------------------------
  # EMR - Medical History & Allergy (docs/06-tasks/task-061.md/task-062.md, Epic L)
