          schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED, PARTIALLY_RECEIVED, RECEIVED] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /warehouse/reports/expiry:
    get:
      tags: [Warehouse]
      summary: "Expiry report -- near-expiry, expired, quarantined batches and remaining quantity"
      x-permission: warehouse.report.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, QUARANTINED, EXPIRED, DEPLETED] }
        - name: expiryFrom
          in: query
          schema: { type: string, format: date }
        - name: expiryTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /warehouse/reports/opnames:
    get:
      tags: [Warehouse]
      summary: "Opnames report -- snapshot, count, variance, approval"
      x-permission: warehouse.report.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, COUNTING, SUBMITTED, APPROVED, POSTED, REJECTED] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # Finance -- Chart of Accounts (docs/06-tasks/task-143.md..task-145.md,
  # docs/03-sad/17-module-finance.md Section 6.1)
  # ---------------------------------------------------------------------
  /finance/accounts:
    get:
      tags: [Finance]
      summary: List accounts (Chart of Accounts)
      x-permission: finance.account.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: accountType
          in: query
          schema: { type: string, enum: [asset, liability, equity, revenue, expense] }
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: isPostable
          in: query
          schema: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Finance]
      summary: Create an account
      x-permission: finance.account.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, accountType, normalBalance, isPostable]
              properties:
                branchId: { type: string, format: uuid, nullable: true, description: "Omit for a shared-template account" }
                code: { type: string, example: "1110" }
                name: { type: string, example: "Kas Utama" }
                accountType: { type: string, enum: [asset, liability, equity, revenue, expense] }
                normalBalance: { type: string, enum: [debit, credit] }
                parentId: { type: string, format: uuid, nullable: true }
                isPostable: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: "Parent account not found", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '409': { description: "FIN_ACCOUNT_CODE_EXISTS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "FIN_ACCOUNT_TYPE_MISMATCH -- accountType/normalBalance inconsistent", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/accounts/{accountId}:
    patch:
      tags: [Finance]
      summary: Update an account (name/accountType/normalBalance/parentId/isPostable)
      x-permission: finance.account.manage
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_ACCOUNT_TYPE_MISMATCH or FIN_ACCOUNT_CYCLIC_HIERARCHY", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/accounts/{accountId}/deactivate:
    post:
      tags: [Finance]
      summary: Deactivate an account (no hard delete -- historical ledger stays visible)
      x-permission: finance.account.manage
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Finance -- Journals (docs/06-tasks/task-146.md..task-152.md,
  # docs/03-sad/17-module-finance.md Section 6.2, UC-FIN-002)
  # ---------------------------------------------------------------------
  /finance/journals:
    get:
      tags: [Finance]
      summary: List journals
      x-permission: finance.journal.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, POSTED, REVERSED, VOIDED] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Finance]
      summary: Create a manual journal (draft; unaffected ledger until Post)
      x-permission: finance.journal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, journalDate, description, lines]
              properties:
                branchId: { type: string, format: uuid }
                journalDate: { type: string, format: date }
                description: { type: string, example: "Accrual listrik Juli 2026" }
                lines:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [accountId, debit, credit]
                    properties:
                      accountId: { type: string, format: uuid }
                      debit: { type: number }
                      credit: { type: number }
                      description: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "FIN_JOURNAL_UNBALANCED or FIN_ACCOUNT_NOT_POSTABLE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/journals/{journalId}:
    get:
      tags: [Finance]
      summary: Journal detail (with lines and computed debit/credit totals)
      x-permission: finance.journal.read
      parameters: [{ name: journalId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Finance]
      summary: Update a draft journal's date/description/lines (rejected once posted/reversed/voided)
      x-permission: finance.journal.update
      parameters: [{ name: journalId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_JOURNAL_INVALID_STATUS, FIN_JOURNAL_UNBALANCED, or FIN_ACCOUNT_NOT_POSTABLE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/journals/{journalId}/post:
    post:
      tags: [Finance]
      summary: Post a draft journal into the immutable ledger, assigning its journalNo (maker-checker -- poster cannot be the creator)
      x-permission: finance.journal.post
      parameters: [{ name: journalId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: "FIN_SEGREGATION_OF_DUTIES -- creator cannot also post", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "FIN_PERIOD_CLOSED or FIN_DUPLICATE_POSTING", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "FIN_JOURNAL_INVALID_STATUS -- must be draft", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/journals/{journalId}/reverse:
    post:
      tags: [Finance]
      summary: Create a linked reversal journal with swapped debit/credit lines, netting the original to zero
      x-permission: finance.journal.reverse
      parameters: [{ name: journalId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journalDate, reason]
              properties:
                journalDate: { type: string, format: date }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "FIN_PERIOD_CLOSED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "FIN_JOURNAL_INVALID_STATUS -- must be posted (already-reversed journals are no longer POSTED)", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/journals/{journalId}/void:
    post:
      tags: [Finance]
      summary: Void a draft journal (rejected once posted -- use Reverse instead)
      x-permission: finance.journal.void
      parameters: [{ name: journalId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_JOURNAL_INVALID_STATUS -- must be draft", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # Finance -- Financial Period (docs/06-tasks/task-168.md, folded into
  # Epic AC; Lock/Close/Reopen land with Epic AE)
  # ---------------------------------------------------------------------
  /finance/periods:
    get:
      tags: [Finance]
      summary: List financial periods
      x-permission: finance.period.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, LOCKED, CLOSED] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Finance]
      summary: Create a financial period (date ranges for open/locked periods must not overlap within a branch)
      x-permission: finance.period.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, periodName, startDate, endDate]
              properties:
                branchId: { type: string, format: uuid }
                periodName: { type: string, example: "Juli 2026" }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "FIN_PERIOD_OVERLAP", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # Finance -- Cash & Expense (docs/06-tasks/task-153.md..task-161.md,
  # docs/03-sad/17-module-finance.md Section 6.3, UC-FIN-003/UC-FIN-004)
  # ---------------------------------------------------------------------
  /finance/account-mappings:
    get:
      tags: [Finance]
      summary: List account mappings (payment method -> cash/revenue account posting configuration for task-162's Automatic Billing Event)
      x-permission: finance.account-mapping.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Finance]
      summary: Create an account mapping for a branch/payment method -- one active mapping per (branchId, paymentMethodId)
      x-permission: finance.account-mapping.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, paymentMethodId, cashAccountId, revenueAccountId]
              properties:
                branchId: { type: string, format: uuid }
                paymentMethodId: { type: string, format: uuid }
                cashAccountId: { type: string, format: uuid }
                revenueAccountId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: "FIN_ACCOUNT_MAPPING_EXISTS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/cash-accounts:
    get:
      tags: [Finance]
      summary: List cash/bank accounts
      x-permission: finance.cash.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: accountType
          in: query
          schema: { type: string, enum: [cash, bank, clearing] }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Finance]
      summary: Create a cash/bank account, linked to a postable ledger account
      x-permission: finance.cash.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, code, name, accountType, ledgerAccountId]
              properties:
                branchId: { type: string, format: uuid }
                code: { type: string, example: "CASH-1" }
                name: { type: string, example: "Kas Kecil" }
                accountType: { type: string, enum: [cash, bank, clearing] }
                ledgerAccountId: { type: string, format: uuid }
                accountNumber: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "FIN_ACCOUNT_MAPPING_MISSING", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/cash-accounts/{cashAccountId}/movements:
    get:
      tags: [Finance]
      summary: Cash account movement history (posted journal lines against its linked ledger account only)
      x-permission: finance.cash.read
      parameters:
        - { name: cashAccountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/cash-transfers:
    post:
      tags: [Finance]
      summary: Transfer between two distinct active cash accounts in the same branch -- posts an already-posted system journal and updates both balances
      x-permission: finance.cash.transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transferDate, sourceCashAccountId, destinationCashAccountId, amount]
              properties:
                transferDate: { type: string, format: date }
                sourceCashAccountId: { type: string, format: uuid }
                destinationCashAccountId: { type: string, format: uuid }
                amount: { type: number }
                description: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "FIN_PERIOD_CLOSED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "FIN_CASH_TRANSFER_SOURCE_DESTINATION_SAME or FIN_CASH_TRANSFER_CROSS_BRANCH", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/expenses:
    get:
      tags: [Finance]
      summary: List expenses
      x-permission: finance.expense.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, PAID, CANCELLED] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Finance]
      summary: Create a draft expense
      x-permission: finance.expense.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, expenseDate, category, expenseAccountId, amount]
              properties:
                branchId: { type: string, format: uuid }
                expenseDate: { type: string, format: date }
                category: { type: string, example: "utility" }
                expenseAccountId: { type: string, format: uuid }
                amount: { type: number }
                payeeName: { type: string }
                description: { type: string }
                evidenceUrl: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "FIN_ACCOUNT_NOT_POSTABLE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/expenses/{expenseId}:
    get:
      tags: [Finance]
      summary: Expense detail
      x-permission: finance.expense.read
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Finance]
      summary: Update a draft expense (rejected once submitted/approved/paid)
      x-permission: finance.expense.create
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_EXPENSE_INVALID_STATUS or FIN_ACCOUNT_NOT_POSTABLE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/expenses/{expenseId}/submit:
    post:
      tags: [Finance]
      summary: Submit a draft expense for approval
      x-permission: finance.expense.create
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_EXPENSE_INVALID_STATUS -- must be draft", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/expenses/{expenseId}/approve:
    post:
      tags: [Finance]
      summary: Approve a submitted expense (maker-checker -- approver cannot be the requester)
      x-permission: finance.expense.approve
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approvedAmount: { type: number }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: "FIN_SEGREGATION_OF_DUTIES", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_EXPENSE_INVALID_STATUS -- must be submitted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/expenses/{expenseId}/reject:
    post:
      tags: [Finance]
      summary: Reject a submitted expense (mandatory reason)
      x-permission: finance.expense.approve
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_EXPENSE_INVALID_STATUS -- must be submitted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/expenses/{expenseId}/pay:
    post:
      tags: [Finance]
      summary: Pay an approved expense -- posts a system journal debiting the expense account and crediting the chosen cash account
      x-permission: finance.expense.pay
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cashAccountId, paymentDate, amount]
              properties:
                cashAccountId: { type: string, format: uuid }
                paymentDate: { type: string, format: date }
                amount: { type: number }
                referenceNo: { type: string, example: "BKK-20260731-001" }
                note: { type: string, example: "Pembayaran listrik" }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "FIN_EXPENSE_NOT_APPROVED or FIN_PERIOD_CLOSED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "FIN_EXPENSE_PAYMENT_EXCEEDS_APPROVED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # Finance -- Daily Closing (docs/06-tasks/task-163.md..task-165.md,
  # docs/03-sad/17-module-finance.md Section 6.4, UC-FIN-005)
  # ---------------------------------------------------------------------
  /finance/daily-closings:
    get:
      tags: [Finance]
      summary: List daily closings
      x-permission: finance.cash.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: cashAccountId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [SUBMITTED, APPROVED] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Finance]
      summary: Submit a daily cash closing -- expected balance is read from the cash account's current balance, variance requires a reason
      x-permission: finance.cash.close
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, cashAccountId, cashierId, closingDate, countedBalance]
              properties:
                branchId: { type: string, format: uuid }
                cashAccountId: { type: string, format: uuid }
                cashierId: { type: string, format: uuid }
                closingDate: { type: string, format: date }
                countedBalance: { type: number, example: 2150000.00 }
                denominations:
                  type: array
                  items:
                    type: object
                    properties:
                      nominal: { type: number, example: 100000 }
                      quantity: { type: number, example: 20 }
                varianceReason: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "FIN_CLOSING_DUPLICATE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "FIN_CLOSING_VARIANCE_REASON_REQUIRED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/daily-closings/{closingId}/approve:
    post:
      tags: [Finance]
      summary: Approve a submitted daily closing (maker-checker -- approver cannot be the requester)
      x-permission: finance.cash.approve_close
      parameters: [{ name: closingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: "FIN_SEGREGATION_OF_DUTIES", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_CLOSING_INVALID_STATUS -- must be submitted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # Finance -- Doctor Fee Settlement (docs/06-tasks/task-166.md/
  # task-167.md, docs/03-sad/17-module-finance.md Section 6.4, UC-FIN-006)
  # ---------------------------------------------------------------------
  /finance/doctor-fee-settlements/generate:
    post:
      tags: [Finance]
      summary: Generate a draft settlement aggregating unsettled doctor-fee source lines for a doctor/branch/period
      x-permission: finance.settlement.generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, doctorId, periodStart, periodEnd, feeAccountId]
              properties:
                branchId: { type: string, format: uuid }
                doctorId: { type: string, format: uuid }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                feeAccountId: { type: string, format: uuid, description: "Ledger account debited when this settlement is paid" }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "FIN_ACCOUNT_NOT_POSTABLE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/doctor-fee-settlements/{settlementId}/approve:
    post:
      tags: [Finance]
      summary: Approve a draft settlement (maker-checker -- approver cannot be the requester)
      x-permission: finance.settlement.approve
      parameters: [{ name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: "FIN_SEGREGATION_OF_DUTIES", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_SETTLEMENT_INVALID_STATUS -- must be draft", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/doctor-fee-settlements/{settlementId}/pay:
    post:
      tags: [Finance]
      summary: Pay an approved settlement -- posts a system journal debiting the settlement's fee account and crediting the chosen cash account
      x-permission: finance.settlement.pay
      parameters: [{ name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cashAccountId, paymentDate]
              properties:
                cashAccountId: { type: string, format: uuid }
                paymentDate: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "FIN_SETTLEMENT_NOT_APPROVED or FIN_PERIOD_CLOSED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # Finance -- Financial Period Lock/Close/Reopen (docs/06-tasks/
  # task-169.md..task-171.md, docs/03-sad/17-module-finance.md UC-FIN-007;
  # Create/List landed in Epic AC)
  # ---------------------------------------------------------------------
  /finance/periods/{periodId}/lock:
    post:
      tags: [Finance]
      summary: Lock an open financial period (Open -> Locked)
      x-permission: finance.period.lock
      parameters: [{ name: periodId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_PERIOD_INVALID_STATUS -- must be open", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/periods/{periodId}/close:
    post:
      tags: [Finance]
      summary: Close a locked financial period (Locked -> Closed), publishing finance.period.closed.v1 exactly once
      x-permission: finance.period.close
      parameters: [{ name: periodId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "FIN_PERIOD_INVALID_STATUS -- must be locked", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /finance/periods/{periodId}/reopen:
    post:
      tags: [Finance]
      summary: "Reopen a closed period (Closed -> Open) -- elevated, mandatory-reason action distinct from ordinary period.manage"
      x-permission: finance.period.reopen
      parameters: [{ name: periodId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
