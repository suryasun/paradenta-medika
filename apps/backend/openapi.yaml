      x-permission: masterdata.tooth-condition.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conditionCode, conditionName, category]
              properties:
                conditionCode: { type: string, minLength: 2, maxLength: 30 }
                conditionName: { type: string, minLength: 2, maxLength: 100 }
                category: { type: string, enum: [HEALTHY, DISEASE, RESTORATION, PROSTHODONTIC, ENDODONTIC, SURGICAL, ORTHODONTIC, IMPLANTOLOGY] }
                colorCode: { type: string, maxLength: 20 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tooth-conditions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Tooth Conditions]
      summary: Tooth condition detail
      x-permission: masterdata.tooth-condition.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Tooth Conditions]
      summary: Update tooth condition (e.g. deactivate via isActive)
      x-permission: masterdata.tooth-condition.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conditionName: { type: string, minLength: 2, maxLength: 100 }
                category: { type: string, enum: [HEALTHY, DISEASE, RESTORATION, PROSTHODONTIC, ENDODONTIC, SURGICAL, ORTHODONTIC, IMPLANTOLOGY] }
                colorCode: { type: string, maxLength: 20 }
                isActive: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Master Data - Consent Templates (docs/06-tasks/task-085.md, Epic R)
  # Registered inside emr.routes.ts (permission codes are emr.* since
  # Consent is an EMR-owned catalog), tagged as Master Data here to match
  # this spec's per-resource tag granularity for other catalog CRUD.
  # ---------------------------------------------------------------------
  /consent-templates:
    get:
      tags: [Master Data - Consent Templates]
      summary: List consent templates
      x-permission: emr.consent-template.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Master Data - Consent Templates]
      summary: Create consent template
      x-permission: emr.consent-template.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, title, body]
              properties:
                category: { type: string, enum: [GENERAL, CLINICAL, SURGICAL] }
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /consent-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Master Data - Consent Templates]
      summary: Consent template detail
      x-permission: emr.consent-template.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Master Data - Consent Templates]
      summary: Update consent template (e.g. deactivate via isActive)
      x-permission: emr.consent-template.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string, enum: [GENERAL, CLINICAL, SURGICAL] }
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1 }
                isActive: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Patient (docs/06-tasks/task-001.md, task-027.md..task-030.md)
  # ---------------------------------------------------------------------
  /patients:
    get:
      tags: [Patient]
      summary: List / search patients
      x-permission: patient.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Patient]
      summary: Register patient (generates Medical Record Number)
      x-permission: patient.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientName, gender, birthDate, phone, address]
              properties:
                patientName: { type: string }
                identityType: { type: string, enum: [KTP, PASSPORT, SIM, OTHER] }
                identityNumber: { type: string }
                birthPlace: { type: string }
                birthDate: { type: string, format: date }
                gender: { type: string, enum: [MALE, FEMALE] }
                phone: { type: string }
                email: { type: string, format: email }
                address: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /patients/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Patient]
      summary: Patient detail
      x-permission: patient.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Patient]
      summary: Update patient
      x-permission: patient.update
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{id}/archive:
    patch:
      tags: [Patient]
      summary: Archive patient (soft, reversible)
      x-permission: patient.archive
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{id}/restore:
    patch:
      tags: [Patient]
      summary: Restore an archived patient
      x-permission: patient.archive
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Reservation (docs/06-tasks/task-002.md, task-031.md..task-036.md)
  # ---------------------------------------------------------------------
  /reservations:
    get:
      tags: [Reservation]
      summary: List / search reservations
      x-permission: reservation.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - name: reservationType
          in: query
          schema: { type: string }
        - name: reservationSource
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Reservation]
      summary: Create reservation (scheduled) or walk-in registration
      description: >
        A single endpoint backs both flows: WALK_IN is dispatched to
        WalkInRegistrationUseCase when source or reservationType is
        "WALK_IN" (no date/time required); otherwise CreateReservationUseCase
        handles a scheduled appointment.
      x-permission: reservation.create
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: "Double-booking or same-patient-same-day conflict", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # docs/06-tasks/task-060.md (Epic K). Registered before /reservations/{id}
  # so Express doesn't match "analytics" as the :id param.
  /reservations/analytics:
    get:
      tags: [Reservation]
      summary: Reservation analytics dashboard (trend, peak hours, doctor utilization, conversion, walk-in ratio, cancellation/no-show trend, KPIs)
      x-permission: reservation.analytics.read
      parameters:
        - name: dateFrom
          in: query
          description: Defaults to 30 days before dateTo when omitted (not a literal SAD default).
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: Defaults to today when omitted (not a literal SAD default).
          schema: { type: string, format: date }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Analytics computed for the requested date range
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dateRange:
                            type: object
                            properties: { from: { type: string, format: date }, to: { type: string, format: date } }
                          reservationTrend: { type: array, items: { $ref: '#/components/schemas/DateCountPoint' } }
                          peakHourAnalysis:
                            type: array
                            items:
                              type: object
                              properties: { hour: { type: integer }, count: { type: integer } }
                          doctorUtilization:
                            type: array
                            items:
                              type: object
                              properties: { doctorId: { type: string, format: uuid }, count: { type: integer } }
                          appointmentConversion:
                            type: object
                            properties: { totalCount: { type: integer }, completedCount: { type: integer }, conversionRate: { type: number } }
                          walkinRatio:
                            type: object
                            properties: { walkinCount: { type: integer }, totalCount: { type: integer }, ratio: { type: number } }
                          cancellationTrend: { type: array, items: { $ref: '#/components/schemas/DateCountPoint' } }
                          noShowTrend: { type: array, items: { $ref: '#/components/schemas/DateCountPoint' } }
                          kpi:
                            type: object
                            properties:
                              totalReservations: { type: integer }
                              dailyReservations: { type: integer }
                              weeklyReservations: { type: integer }
                              monthlyReservations: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "SYS_BRANCH_SCOPE_FORBIDDEN -- docs/06-tasks/task-216.md BranchScopeGuard retrofit demonstration: the requested branchId is outside a non-cross-branch requester's assignment", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /reservations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Reservation]
      summary: Reservation detail
      x-permission: reservation.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reservation]
      summary: Update reservation
      x-permission: reservation.update
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{id}/reschedule:
    patch:
      tags: [Reservation]
      summary: Reschedule to a new date/time
      x-permission: reservation.reschedule
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{id}/cancel:
    patch:
      tags: [Reservation]
      summary: Cancel reservation
      x-permission: reservation.cancel
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{id}/check-in:
    patch:
      tags: [Reservation]
      summary: Check in patient (publishes PatientCheckedIn -> auto-creates Queue entry)
      x-permission: reservation.check-in
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /doctors/{id}/availability:
    get:
      tags: [Reservation]
      summary: Doctor availability for a date
      x-permission: reservation.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /doctors/{id}/time-slots:
    get:
      tags: [Reservation]
      summary: Bookable time slots for a doctor on a date
      x-permission: reservation.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # Queue (docs/06-tasks/task-037.md..task-047.md)
  # ---------------------------------------------------------------------
  /queues/dashboard:
    get:
      tags: [Queue]
      summary: Queue dashboard (status/doctor summary, wait/service time)
      x-permission: queue.dashboard.read
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /queues:
    get:
      tags: [Queue]
      summary: List / search queue entries
      x-permission: queue.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: status
          in: query
          schema: { type: string }
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: visitDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Queue]
      summary: Create queue entry (walk-in; reservation check-in creates one automatically)
      x-permission: queue.create
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /queues/{id}:
    get:
      tags: [Queue]
      summary: Queue entry detail
      x-permission: queue.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /queues/{id}/call:
    patch:
      tags: [Queue]
      summary: Call the next queue entry (WAITING -> CALLED)
      x-permission: queue.call
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/recall:
    patch:
      tags: [Queue]
      summary: Recall (repeat) a CALLED entry's announcement
      x-permission: queue.recall
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /queues/{id}/skip:
    patch:
      tags: [Queue]
      summary: Skip a CALLED entry (CALLED -> SKIPPED)
      x-permission: queue.skip
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/start:
    patch:
      tags: [Queue]
      summary: Start service (CALLED -> IN_SERVICE)
      x-permission: queue.start
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/complete:
    patch:
      tags: [Queue]
      summary: Complete service (IN_SERVICE -> COMPLETED)
      x-permission: queue.complete
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/cancel:
    patch:
      tags: [Queue]
      summary: Cancel a queue entry
      x-permission: queue.cancel
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /queues/{id}/transfer:
    patch:
      tags: [Queue]
      summary: Transfer a queue entry to a different doctor
      x-permission: queue.transfer
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId]
              properties:
                doctorId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # EMR (docs/06-tasks/task-048.md..task-053.md)
  # ---------------------------------------------------------------------
  /emr/visits:
    post:
      tags: [EMR]
      summary: Open a Visit from a CALLED Queue entry
      x-permission: emr.visit.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queueId]
              properties:
                queueId: { type: string, format: uuid }
                chiefComplaint: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}:
    get:
      tags: [EMR]
      summary: Visit detail (with vital signs, SOAP, diagnoses, treatments)
      x-permission: emr.visit.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/visits/{id}/vital-signs:
    post:
      tags: [EMR]
      summary: Record vital signs (Visit must be open)
      x-permission: emr.vital.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/soap-note:
    put:
      tags: [EMR]
      summary: Upsert the Visit's SOAP note (Subjective/Objective/Assessment/Plan)
      x-permission: emr.soap.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjective: { type: string }
                objective: { type: string }
                assessment: { type: string }
                plan: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/diagnoses:
    post:
      tags: [EMR]
      summary: Record diagnosis entries (>=1 PRIMARY required)
      x-permission: emr.diagnosis.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diagnoses]
              properties:
                diagnoses:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [diagnosisType, diagnosisName]
                    properties:
                      diagnosisType: { type: string, enum: [PRIMARY, SECONDARY, DIFFERENTIAL] }
                      diagnosisName: { type: string }
                      notes: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/treatments:
    post:
      tags: [EMR]
      summary: Record a Treatment entry (price snapshotted from catalog at entry time)
      x-permission: emr.treatment.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [treatmentId]
              properties:
                treatmentId: { type: string, format: uuid }
                toothReference: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
                notes: { type: string }
                materials:
                  type: array
                  description: docs/03-sad/15-module-emr.md Section 23 "Material Used" (task-136, Epic Z) -- ad-hoc, per-procedure Warehouse items consumed. Each itemId must be an existing, consumable Warehouse item.
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      quantity: { type: number, minimum: 0.01 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{id}/close:
    post:
      tags: [EMR]
      summary: Close Visit (requires complete SOAP + >=1 Treatment; publishes EMRFinished, and emr.treatment-material-finalized.v1 per treatment entry with recorded materials)
      x-permission: emr.visit.close
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  # ---------------------------------------------------------------------
  # EMR - Medical History & Allergy (docs/06-tasks/task-061.md/task-062.md, Epic L)
  # Patient-scoped, not Visit-scoped. GET reuses emr.visit.read (neither
  # task names a dedicated read permission).
  # ---------------------------------------------------------------------
  /patients/{patientId}/medical-history:
    parameters: [{ $ref: '#/components/parameters/PatientId' }]
    post:
      tags: [EMR]
      summary: Record a medical history entry (append-only; a new entry of the same category deactivates the prior one)
      x-permission: emr.medical-history.record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category: { type: string, enum: [SYSTEMIC_DISEASE, HEART_DISEASE, DIABETES, HYPERTENSION, HEPATITIS, HIV, BLEEDING_DISORDER, SURGERY_HISTORY, PREGNANCY, HOSPITALIZATION_HISTORY] }
                description: { type: string, minLength: 1, maxLength: 2000 }
                visitId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [EMR]
      summary: List a patient's medical history (active and inactive)
      x-permission: emr.visit.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /patients/{patientId}/allergies:
    parameters: [{ $ref: '#/components/parameters/PatientId' }]
    post:
      tags: [EMR]
      summary: Record an allergy entry
      x-permission: emr.allergy.record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, allergen, severity]
              properties:
                type: { type: string, enum: [DRUG, FOOD, LATEX, MATERIAL, LOCAL_ANESTHETIC, OTHER] }
                allergen: { type: string, minLength: 1, maxLength: 150 }
                severity: { type: string, enum: [MILD, MODERATE, SEVERE] }
                reaction: { type: string, maxLength: 1000 }
                notes: { type: string, maxLength: 1000 }
                visitId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [EMR]
      summary: List a patient's allergies
      x-permission: emr.visit.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # EMR - Interactive Odontogram (docs/06-tasks/task-067.md..task-070.md, Epic O)
  # ---------------------------------------------------------------------
  /emr/visits/{id}/odontogram:
    post:
      tags: [EMR]
      summary: Record a tooth condition entry against an open Visit (append-only history)
      x-permission: emr.odontogram.record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toothNumber, toothConditionId]
              properties:
                toothNumber: { type: integer, minimum: 11, maximum: 85, description: "FDI notation" }
                surface: { type: string, maxLength: 10 }
                toothConditionId: { type: string, format: uuid }
                note: { type: string, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /patients/{patientId}/odontogram:
    get:
      tags: [EMR]
      summary: Current odontogram (latest entry per tooth) for a patient
      x-permission: emr.odontogram.read
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /patients/{patientId}/odontogram/{toothNumber}/history:
    get:
      tags: [EMR]
      summary: Full condition history for a single tooth
      x-permission: emr.odontogram.read
      parameters:
        - { $ref: '#/components/parameters/PatientId' }
        - name: toothNumber
          in: path
          required: true
          schema: { type: integer, minimum: 11, maximum: 85 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # EMR - Treatment Planning (docs/06-tasks/task-063.md/task-064.md, Epic M)
  # ---------------------------------------------------------------------
  /emr/visits/{id}/treatment-plan:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [EMR]
      summary: Create treatment plan items for an open Visit
      x-permission: emr.treatment-plan.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [treatmentId, estimatedCost]
                    properties:
                      treatmentId: { type: string, format: uuid }
                      toothNumber: { type: integer }
                      surface: { type: string }
                      priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
                      estimatedCost: { type: number }
                      estimatedDurationMinute: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
    get:
      tags: [EMR]
      summary: List treatment plan items for a Visit
      x-permission: emr.treatment-plan.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /emr/treatment-plan/{itemId}/convert-to-reservation:
    post:
      tags: [EMR]
      summary: Convert a Treatment Plan item into a scheduled Reservation
      description: Requires both emr.treatment-plan.read and reservation.create (task-064's Security Impact literally names both).
      x-permission: "emr.treatment-plan.read, reservation.create"
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId, reservationDate, startTime, reservationType, source]
              properties:
                doctorId: { type: string, format: uuid }
                reservationDate: { type: string, format: date }
                startTime: { type: string, pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$" }
                reservationType: { type: string, maxLength: 30 }
                source: { type: string, enum: [WALK_IN, PHONE, WHATSAPP, WEBSITE, MOBILE_APP] }
                complaint: { type: string, maxLength: 1000 }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------------
  # EMR - Periodontal Assessment (docs/06-tasks/task-071.md..task-077.md, Epic P)
  # Literal endpoint paths per docs/03-sad/15-module-emr.md Part 3.2D
  # Section 39 OpenAPI Specification.
  # ---------------------------------------------------------------------
  /emr/periodontal-assessments:
    post:
      tags: [EMR]
      summary: Create a periodontal assessment for an open Visit
      x-permission: emr.periodontal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, patientId, doctorId]
              properties:
                visitId: { type: string, format: uuid }
                patientId: { type: string, format: uuid }
                doctorId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/periodontal-assessments/{assessmentId}/measurements:
    post:
      tags: [EMR]
      summary: Add a per-tooth/per-point periodontal measurement (CAL auto-computed server-side)
      x-permission: emr.periodontal.measurement.record
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toothNumber, measurementPoint, pocketDepth, gingivalMargin, bleeding]
              properties:
                toothNumber: { type: integer }
                measurementPoint: { type: string, enum: [MB, B, DB, ML, L, DL] }
                pocketDepth: { type: number, minimum: 0, maximum: 15 }
                gingivalMargin: { type: number, minimum: -10, maximum: 10 }
                bleeding: { type: boolean }
                plaqueIndex: { type: integer, minimum: 0, maximum: 3 }
                mobility: { type: integer, minimum: 0, maximum: 3 }
                furcation: { type: string, enum: ["0", "I", "II", "III"], description: "Molars only (multiroot teeth)" }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/periodontal-assessments/{assessmentId}/measurements/{id}:
    parameters:
      - name: assessmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [EMR]
      summary: Update a periodontal measurement
      x-permission: emr.periodontal.measurement.update
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
    delete:
      tags: [EMR]
      summary: Delete a periodontal measurement
      x-permission: emr.periodontal.measurement.delete
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/periodontal-assessments/{assessmentId}:
    get:
      tags: [EMR]
      summary: Periodontal assessment detail (with all measurements)
      x-permission: emr.periodontal.read
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/periodontal-assessments/{assessmentId}/history:
    get:
      tags: [EMR]
      summary: All periodontal assessments (history) for the assessment's patient
      x-permission: emr.periodontal.read
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/periodontal-assessments/{assessmentId}/lock:
    post:
      tags: [EMR]
      summary: Lock a periodontal assessment (immutable afterward)
      x-permission: emr.periodontal.lock
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  # ---------------------------------------------------------------------
  # EMR - Referral & Follow Up (docs/06-tasks/task-089.md/task-090.md, Epic T)
  # ---------------------------------------------------------------------
  /emr/visits/{id}/referrals:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [EMR]
      summary: Create a referral to an external Specialist/Hospital/Laboratory/Radiology
      x-permission: emr.referral.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, reason]
              properties:
                targetType: { type: string, enum: [SPECIALIST, HOSPITAL, LABORATORY, RADIOLOGY] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                note: { type: string, maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
    get:
      tags: [EMR]
      summary: List referrals for a Visit
      x-permission: emr.visit.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /emr/visits/{id}/follow-ups:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [EMR]
      summary: Schedule a follow up, optionally auto-booking a Reservation
      x-permission: emr.followup.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [followUpDate]
              properties:
                followUpDate: { type: string, format: date }
                note: { type: string, maxLength: 2000 }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
                autoSchedule: { type: boolean, description: "When true, doctorId/startTime/reservationType/source become required" }
                doctorId: { type: string, format: uuid }
                startTime: { type: string, pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$" }
                reservationType: { type: string, maxLength: 30 }
                source: { type: string, enum: [WALK_IN, PHONE, WHATSAPP, WEBSITE, MOBILE_APP] }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
    get:
      tags: [EMR]
      summary: List follow ups for a Visit
      x-permission: emr.visit.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # EMR - Clinical Attachment (docs/06-tasks/task-078.md..task-084.md, Epic Q)
  # Literal endpoint paths per docs/03-sad/15-module-emr.md Section 60
  # OpenAPI Specification, except the `attachmentId` re-upload field.
  # ---------------------------------------------------------------------
  /emr/attachments:
    post:
      tags: [EMR]
      summary: Upload an attachment (creates a new Attachment, or a new version when attachmentId is present)
      x-permission: emr.attachment.upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [visitId, patientId, category, file]
              properties:
                visitId: { type: string, format: uuid }
                patientId: { type: string, format: uuid }
                category: { type: string, enum: [CLINICAL_PHOTOGRAPHY, X_RAY, CBCT, CONSENT, PDF, VIDEO, OTHER] }
                attachmentType: { type: string, maxLength: 100 }
                attachmentId: { type: string, format: uuid, description: "When present, adds a new version to this existing Attachment instead of creating a new one" }
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/attachments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [EMR]
      summary: Attachment detail (current version + annotations)
      x-permission: emr.attachment.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/attachments/{id}/download:
    get:
      tags: [EMR]
      summary: Issue a short-lived signed download URL for the current version
      x-permission: emr.attachment.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Signed URL issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string }
                          expiresInSeconds: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/attachments/{id}/annotations:
    post:
      tags: [EMR]
      summary: "Add an annotation (only for annotatable categories: Clinical Photography/X-Ray/CBCT)"
      x-permission: emr.attachment.annotate
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shape, positionX, positionY]
              properties:
                shape: { type: string, maxLength: 30 }
                positionX: { type: number }
                positionY: { type: number }
                width: { type: number }
                height: { type: number }
                text: { type: string, maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/visits/{visitId}/attachments:
    get:
      tags: [EMR]
      summary: List attachments for a Visit
      x-permission: emr.attachment.read
      parameters: [{ $ref: '#/components/parameters/VisitId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /emr/attachments/{id}/archive:
    post:
      tags: [EMR]
      summary: Archive an attachment
      x-permission: emr.attachment.archive
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/attachments/{id}/versions:
    get:
      tags: [EMR]
      summary: List all versions of an attachment
      x-permission: emr.attachment.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/attachments/{id}/versions/{version}/restore:
    post:
      tags: [EMR]
      summary: Restore a prior version as the current version
      x-permission: emr.attachment.restore
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/file/{token}:
    get:
      tags: [EMR]
      summary: Serve the actual file bytes for a signed download URL (unauthenticated by design -- the JWT-signed token IS the authorization)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: "File bytes" }
        '401': { description: "Invalid or expired signed token", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # EMR - Prescription (docs/06-tasks/task-065.md/task-066.md, Epic N)
  # ---------------------------------------------------------------------
  /emr/visits/{id}/prescriptions:
    post:
      tags: [EMR]
      summary: Create a prescription (hard-blocked if any item conflicts with a recorded Drug allergy)
      x-permission: emr.prescription.create
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [medicineName, dosage, frequency, duration]
                    properties:
                      medicineName: { type: string }
                      dosage: { type: string }
                      frequency: { type: string }
                      duration: { type: string }
                      instruction: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "PRESCRIPTION_ALLERGY_CONFLICT -- patient has a recorded Drug allergy to a prescribed medicine", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /patients/{patientId}/prescriptions:
    get:
      tags: [EMR]
      summary: A patient's full, permanent prescription history
      x-permission: emr.prescription.read
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /emr/prescriptions/{id}/print:
    get:
      tags: [EMR]
      summary: Printable prescription (includes patient/doctor names)
      x-permission: emr.prescription.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # EMR - Consent (docs/06-tasks/task-086.md/task-087.md, Epic R)
  # ---------------------------------------------------------------------
  /emr/consents:
    post:
      tags: [EMR]
      summary: Instantiate a consent from a template for a Visit
      x-permission: emr.consent.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, templateId, procedure]
              properties:
                visitId: { type: string, format: uuid }
                templateId: { type: string, format: uuid }
                procedure: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /emr/consents/{id}/sign:
    post:
      tags: [EMR]
      summary: Sign a consent (immutable afterward); stores the signed document as an Attachment
      x-permission: emr.consent.sign
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signerName, signerRelationship, signatureData]
              properties:
                signerName: { type: string, minLength: 1, maxLength: 150 }
                signerRelationship: { type: string, enum: [SELF, FATHER, MOTHER, HUSBAND, WIFE, LEGAL_GUARDIAN] }
                signatureData: { type: string, description: "Opaque signature payload, e.g. a data: URL from a canvas draw" }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "CONSENT_ALREADY_SIGNED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /emr/consents/{id}:
    get:
      tags: [EMR]
      summary: Consent detail
      x-permission: emr.consent.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/consents:
    get:
      tags: [EMR]
      summary: All consents (signed and unsigned) for a patient, chronological
      x-permission: emr.consent.read
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # EMR - Medical Certificate (docs/06-tasks/task-088.md, Epic S)
  # ---------------------------------------------------------------------
  /emr/visits/{id}/medical-certificates:
    post:
      tags: [EMR]
      summary: Issue a medical certificate (Doctor role only); stores the document as an Attachment
      x-permission: emr.certificate.issue
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificateType, content]
              properties:
                certificateType: { type: string, enum: [FIT_TO_WORK, SICK_LEAVE, MEDICAL_STATEMENT, DENTAL_TREATMENT_CERTIFICATE] }
                content: { type: string, minLength: 1 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { description: "ONLY_DOCTOR_CAN_ISSUE_CERTIFICATE -- acting user is not a registered Doctor", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /emr/medical-certificates/{id}:
    get:
      tags: [EMR]
      summary: Medical certificate detail
      x-permission: emr.certificate.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/medical-certificates:
    get:
      tags: [EMR]
      summary: All medical certificates issued for a patient
      x-permission: emr.certificate.read
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------
  # EMR - Clinical Timeline (docs/06-tasks/task-091.md..task-094.md, Epic U)
  # Read-only aggregation across every other Phase 2 EMR feature into a
  # single chronologically-ordered feed per docs/03-sad/15-module-emr.md
  # Part 3.4's literal API Endpoint list.
  # ---------------------------------------------------------------------
  /emr/timeline/{patientId}:
    get:
      tags: [EMR]
      summary: Full chronological clinical timeline for a patient
      x-permission: emr.timeline.read
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/timeline/{patientId}/summary:
    get:
      tags: [EMR]
      summary: Condensed summary (most recent visit, active alerts, open treatment plan items, last prescription)
      x-permission: emr.timeline.read
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/timeline/{patientId}/events:
    get:
      tags: [EMR]
      summary: Timeline filtered by a single event type
      x-permission: emr.timeline.read
      parameters:
        - { $ref: '#/components/parameters/PatientId' }
        - name: eventType
          in: query
          schema: { type: string, enum: [VISIT, SOAP, DIAGNOSIS, TREATMENT, PRESCRIPTION, ODONTOGRAM, ATTACHMENT, CONSENT, REFERRAL, FOLLOW_UP] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /emr/timeline/{patientId}/attachments:
    get:
      tags: [EMR]
      summary: All attachments across every visit for a patient (cross-visit gallery, distinct from the single-visit /emr/visits/{visitId}/attachments)
      x-permission: "emr.timeline.read, emr.attachment.read"
      parameters: [{ $ref: '#/components/parameters/PatientId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Billing (docs/06-tasks/task-054.md..task-058.md)
  # ---------------------------------------------------------------------
  /billing/invoices:
    get:
      tags: [Billing]
      summary: List invoices
      x-permission: billing.invoice.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: status
          in: query
          schema: { type: string, enum: [UNPAID, PARTIALLY_PAID, PAID, CLOSED] }
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
        '403': { description: "SYS_BRANCH_SCOPE_FORBIDDEN -- docs/06-tasks/task-216.md BranchScopeGuard retrofit demonstration: the requested branchId is outside a non-cross-branch requester's assignment", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
    post:
      tags: [Billing]
      summary: Generate invoice from a completed Visit (also event-triggered by EMRFinished)
      x-permission: billing.invoice.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId]
              properties:
                visitId: { type: string, format: uuid }
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoiceId: { type: string, format: uuid }
                          invoiceNumber: { type: string, example: "INV-20260801-000001" }
        '409': { description: "Invoice already exists for this Visit", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /billing/invoices/{id}:
    get:
      tags: [Billing]
      summary: Invoice detail (line items + payments)
      x-permission: billing.invoice.read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /billing/invoices/{id}/close:
    post:
      tags: [Billing]
      summary: Close invoice (must be fully PAID; immutable thereafter)
      x-permission: billing.invoice.close
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /billing/payments:
    post:
      tags: [Billing]
      summary: Record a payment (full/partial/split across payment methods)
      x-permission: billing.payment.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, payments]
              properties:
                invoiceId: { type: string, format: uuid }
                payments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [paymentMethodId, amount]
                    properties:
                      paymentMethodId: { type: string, format: uuid }
                      amount: { type: number }
                      referenceNo: { type: string }
                      note: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  # ---------------------------------------------------------------------
  # Reports (docs/06-tasks/task-059.md)
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Reporting - Advanced Dashboards (docs/06-tasks/task-178.md..task-183.md,
  # Epic AG). Projection-backed dashboards per docs/03-sad/20-module-report.md
  # Section 6.1; supersedes the Phase 1 task-059 "today only" implementation
  # at the same /reports/dashboards/operations route (see
  # GetOperationsDashboardUseCase.ts's doc comment). task-184 (HR Dashboard)
  # is not exposed: no HR module/events exist in this codebase yet
  # (documented block, same precedent as task-136/task-162).
  # ---------------------------------------------------------------------
  /reports/dashboards/executive:
    get:
      tags: [Reports]
      summary: Executive dashboard (aggregate cross-module KPIs; payroll cost omitted, no HR module)
      x-permission: report.dashboard.executive.read
      parameters: [{ name: branchId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/DashboardOk' }

  /reports/dashboards/operations:
    get:
      tags: [Reports]
      summary: Operations dashboard (reservation/queue/visit counters, cumulative since projection activation)
      x-permission: report.dashboard.operations.read
      parameters: [{ name: branchId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/DashboardOk' }

  /reports/dashboards/clinical:
    get:
      tags: [Reports]
      summary: Clinical dashboard (aggregate-only visit counter; no PII/free-text per Section 4.7)
      x-permission: report.dashboard.clinical.read
      parameters: [{ name: branchId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/DashboardOk' }

  /reports/dashboards/finance:
    get:
      tags: [Reports]
      summary: Finance dashboard (posted revenue/expense, outstanding balance -- Finance/Billing-authoritative only)
      x-permission: report.dashboard.finance.read
      parameters: [{ name: branchId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/DashboardOk' }

  /reports/dashboards/warehouse:
    get:
      tags: [Reports]
      summary: Warehouse dashboard (low-stock alert gauge)
      x-permission: report.dashboard.warehouse.read
      parameters: [{ name: branchId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/DashboardOk' }

  # docs/06-tasks/task-218.md (Phase 4 Epic BD). Convention-derived path,
  # not a literal row in the Report SAD's Section 6.1 table.
  /reports/dashboards/branch:
    get:
      tags: [Reports]
      summary: Single-branch operational summary (Queue Manager Dashboard fields + Billing daily summary)
      x-permission: report.dashboard.branch.read
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "{ scope, dataAsOf, freshness, definitionVersion, queue: QueueDashboard, billing: DashboardMetric[] }"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '403': { description: "RPT_SCOPE_FORBIDDEN -- a Clinic Manager cannot request a branch outside their assignment", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # Reporting - Catalog & Scheduled Reports (docs/06-tasks/task-185.md..
  # task-191.md, Epic AH). Jobs execute synchronously in-process (no
  # job-queue worker exists in this codebase -- see CreateReportJobUseCase's
  # doc comment); only CSV export is generated (no XLSX/PDF dependency is
  # approved).
  # ---------------------------------------------------------------------
  /reports/definitions:
    get:
      tags: [Reports]
      summary: List the report catalog codes the requester is permitted to run
      x-permission: report.catalog.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # docs/06-tasks/task-219.md (Phase 4 Epic BE). Convention-derived path.
  /reports/branch-comparison:
    get:
      tags: [Reports]
      summary: Point-in-time, side-by-side metric comparison across multiple branches
      description: "docs/06-tasks/task-219.md TC-RPT-008: rejects the whole request (RPT_SCOPE_FORBIDDEN) if any requested branch is outside the requester's authorized scope -- scope is intersected/rejected, never silently widened."
      x-permission: report.branch-comparison.read
      parameters:
        - name: branchIds
          in: query
          required: true
          description: Comma-separated branch UUIDs
          schema: { type: string, example: "11111111-1111-4111-8111-111111111111,22222222-2222-4222-8222-222222222222" }
      responses:
        '200':
          description: "Array of { branchId, branchName, dataAsOf, freshness, metrics: DashboardMetric[] }, same metric set per branch"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '403': { description: "RPT_SCOPE_FORBIDDEN", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # docs/06-tasks/task-220.md (Phase 4 Epic BF). Convention-derived path.
  /reports/branch-performance:
    get:
      tags: [Reports]
      summary: Queue throughput/wait-time, doctor productivity, and billing collection for one branch, trended day-by-day over a period
      description: "docs/06-tasks/task-220.md: distinct from task-219's point-in-time comparison -- one entry per day in the requested range (max 90 days, same sync policy limit as GetReportUseCase)."
      x-permission: report.branch-performance.read
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: "Array of { date, totalPatients, averageWaitingTimeMinutes, completionRate, doctorProductivity: [{doctorId, queueCount}], billingCollected }, one entry per day"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEnvelope' }
        '403': { description: "RPT_SCOPE_FORBIDDEN", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "RPT_FILTER_INVALID (invalid/out-of-order dates) or RPT_RANGE_TOO_LARGE (> 90 days)", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /reports/{reportCode}:
    get:
      tags: [Reports]
      summary: On-demand, synchronous report result for a catalog code
      x-permission: report.catalog.read
      parameters:
        - { name: reportCode, in: path, required: true, schema: { type: string, example: "finance.trial-balance" } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: periodId, in: query, schema: { type: string, format: uuid } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "RPT_SCOPE_FORBIDDEN", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { description: "RPT_DEFINITION_NOT_FOUND", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "RPT_FILTER_INVALID / RPT_RANGE_TOO_LARGE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '503': { description: "RPT_DATASET_UNAVAILABLE -- no backing data source for this report code yet", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /reports/{reportCode}/jobs:
    post:
      tags: [Reports]
      summary: Create a report job (executed synchronously in this deployment; see snapshotId/artifactId in the response)
      x-permission: report.job.create
      parameters: [{ name: reportCode, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    branchIds: { type: array, maxItems: 1, items: { type: string, format: uuid } }
                    dateFrom: { type: string, format: date }
                    dateTo: { type: string, format: date }
                    periodId: { type: string, format: uuid }
                    warehouseId: { type: string, format: uuid }
                    itemId: { type: string, format: uuid }
                    status: { type: string }
                format: { type: string, enum: [csv, json] }
                timezone: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "RPT_SCOPE_FORBIDDEN", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { description: "RPT_DEFINITION_NOT_FOUND", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '409': { description: "RPT_JOB_DUPLICATE -- an equivalent active job already exists", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "RPT_FILTER_INVALID / RPT_RANGE_TOO_LARGE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /reports/jobs/{jobId}:
    get:
      tags: [Reports]
      summary: Report job progress and metadata
      x-permission: report.job.create
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/jobs/{jobId}/cancel:
    post:
      tags: [Reports]
      summary: "Cancel a queued/running job (no-op, not an error, if already terminal)"
      x-permission: report.job.cancel
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/snapshots/{snapshotId}:
    get:
      tags: [Reports]
      summary: Read an immutable report snapshot (checksum-verified)
      x-permission: report.job.create
      parameters: [{ name: snapshotId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "RPT_SNAPSHOT_TAMPERED -- checksum verification failed", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /reports/exports/{artifactId}/download:
    get:
      tags: [Reports]
      summary: Download a sanitised CSV export artifact (short-lived; retention-limited)
      x-permission: report.export.download
      parameters: [{ name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: "CSV file", content: { text/csv: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: "RPT_EXPORT_EXPIRED -- retention period elapsed, no file access granted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  # ---------------------------------------------------------------------
  # Warehouse - Foundation (docs/06-tasks/task-095.md..task-103.md, Epic V)
  # Literal endpoint paths per docs/03-sad/18-module-warehouse.md Section 6.1.
  # ---------------------------------------------------------------------
  /warehouse/items:
    get:
      tags: [Warehouse]
      summary: List items
      x-permission: warehouse.item.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Warehouse]
      summary: Create item
      x-permission: warehouse.item.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, categoryId, unitId, minimumStock, isConsumable, isBatchTracked, isExpiryTracked]
              properties:
                code: { type: string, example: "MAT-COMP-001" }
                name: { type: string, example: "Dental Composite Resin" }
                categoryId: { type: string, format: uuid }
                unitId: { type: string, format: uuid }
                minimumStock: { type: string, example: "10.00" }
                purchasePrice: { type: string }
                sellingPrice: { type: string }
                isConsumable: { type: boolean }
                isBatchTracked: { type: boolean }
                isExpiryTracked: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: "ITEM_CODE_EXISTS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Warehouse]
      summary: Item detail
      x-permission: warehouse.item.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Warehouse]
      summary: Update item (e.g. deactivate via isActive)
      x-permission: warehouse.item.manage
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "ITEM_TRACKING_FLAGS_LOCKED -- isBatchTracked/isExpiryTracked cannot change once the item has stock ledger entries", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/suppliers:
    get:
      tags: [Warehouse]
      summary: List suppliers
      x-permission: warehouse.supplier.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Warehouse]
      summary: Create supplier
      x-permission: warehouse.supplier.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                picName: { type: string }
                phone: { type: string }
                address: { type: string }
                taxNumber: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: "SUPPLIER_CODE_EXISTS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/warehouses:
    get:
      tags: [Warehouse]
      summary: List warehouse locations
      x-permission: warehouse.location.read
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Warehouse]
      summary: Create warehouse location
      x-permission: warehouse.location.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, code, name]
              properties:
                branchId: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                locationType: { type: string, example: "MAIN" }
                address: { type: string }
                managerUserId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "SYS_BRANCH_SCOPE_FORBIDDEN -- docs/06-tasks/task-216.md BranchScopeGuard retrofit demonstration: the payload's branchId is outside a non-cross-branch requester's assignment", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '409': { description: "WAREHOUSE_LOCATION_CODE_EXISTS (duplicate code within the same branch)", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/stocks:
    get:
      tags: [Warehouse]
      summary: List stock balances (current/reserved/available/minimum/status)
      x-permission: warehouse.stock.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }

  /warehouse/stocks/{stockId}/ledger:
    get:
      tags: [Warehouse]
      summary: Immutable stock ledger for one stock line (chronological, running balance)
      x-permission: warehouse.stock.read
      parameters:
        - name: stockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------
  # Warehouse - Procurement (docs/06-tasks/task-104.md..task-114.md, Epic W)
  # UC-WHS-001 (PO)/UC-WHS-002 (Goods Receipt). Permission codes are the
  # literal warehouse.purchase.* catalog from Section 8.1, except
  # warehouse.purchase.post which is an extrapolated addition (see
  # warehouse.routes.ts comment) since task-114 requires it be distinct
  # from warehouse.purchase.receive for segregation of duties and Section
  # 8.1's Purchase group has no separate "post" verb.
  # ---------------------------------------------------------------------
  /warehouse/purchase-orders:
    get:
      tags: [Warehouse]
      summary: List purchase orders
      x-permission: warehouse.purchase.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED, PARTIALLY_RECEIVED, RECEIVED] }
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/PagedOk' }
    post:
      tags: [Warehouse]
      summary: Create purchase order (draft status; branchId is server-derived from warehouseId)
      x-permission: warehouse.purchase.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, warehouseId, items]
              properties:
                supplierId: { type: string, format: uuid }
                warehouseId: { type: string, format: uuid }
                expectedDate: { type: string, format: date }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, quantity, unitPrice]
                    properties:
                      itemId: { type: string, format: uuid }
                      quantity: { type: number }
                      unitPrice: { type: number }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warehouse/purchase-orders/{purchaseOrderId}:
    parameters:
      - name: purchaseOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Warehouse]
      summary: Purchase order detail
      x-permission: warehouse.purchase.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Warehouse]
      summary: Update purchase order (draft only; wholesale replaces line items when provided)
      x-permission: warehouse.purchase.create
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_PO_NOT_DRAFT", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/purchase-orders/{purchaseOrderId}/submit:
    post:
      tags: [Warehouse]
      summary: Submit a draft PO for approval
      x-permission: warehouse.purchase.submit
      parameters: [{ name: purchaseOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_PO_INVALID_STATUS -- only draft POs can be submitted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/purchase-orders/{purchaseOrderId}/approve:
    post:
      tags: [Warehouse]
      summary: Approve a submitted PO (maker-checker -- approver cannot be the requester)
      x-permission: warehouse.purchase.approve
      parameters: [{ name: purchaseOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_SEGREGATION_OF_DUTIES (self-approval) or WHS_PO_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/purchase-orders/{purchaseOrderId}/reject:
    post:
      tags: [Warehouse]
      summary: Reject a submitted PO (mandatory reason)
      x-permission: warehouse.purchase.approve
      parameters: [{ name: purchaseOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_PO_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/purchase-orders/{purchaseOrderId}/cancel:
    post:
      tags: [Warehouse]
      summary: Cancel a PO (rejected once any Goods Receipt has been posted against it)
      x-permission: warehouse.purchase.cancel
      parameters: [{ name: purchaseOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_PO_HAS_POSTED_RECEIPTS or WHS_PO_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/goods-receipts:
    post:
      tags: [Warehouse]
      summary: Create a goods receipt (unposted; stock is unaffected until Post)
      x-permission: warehouse.purchase.receive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseOrderId, warehouseId, receiptDate, items]
              properties:
                purchaseOrderId: { type: string, format: uuid }
                warehouseId: { type: string, format: uuid }
                receiptDate: { type: string, format: date }
                supplierDocumentNo: { type: string, example: "SJ-001" }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purchaseOrderItemId, itemId, quantity, unitCost]
                    properties:
                      purchaseOrderItemId: { type: string, format: uuid }
                      itemId: { type: string, format: uuid }
                      quantity: { type: number }
                      unitCost: { type: number }
                      batchNumber: { type: string, example: "RES-2607-A" }
                      expiryDate: { type: string, format: date }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "WHS_PO_NOT_APPROVED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "WHS_RECEIPT_OVER_QUANTITY or WHS_BATCH_REQUIRED", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/goods-receipts/{goodsReceiptId}:
    get:
      tags: [Warehouse]
      summary: Goods receipt detail (with line items, batch/expiry)
      x-permission: warehouse.purchase.read
      parameters: [{ name: goodsReceiptId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warehouse/goods-receipts/{goodsReceiptId}/post:
    post:
      tags: [Warehouse]
      summary: Post a goods receipt -- the transaction boundary that writes the stock ledger and increments on-hand quantity
      x-permission: warehouse.purchase.post
      parameters: [{ name: goodsReceiptId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "WHS_DUPLICATE_MOVEMENT -- receipt already posted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/transfers:
    post:
      tags: [Warehouse]
      summary: Create a stock transfer between two warehouses (draft; stock is unaffected until Dispatch)
      x-permission: warehouse.stock.transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceWarehouseId, destinationWarehouseId, items]
              properties:
                sourceWarehouseId: { type: string, format: uuid }
                destinationWarehouseId: { type: string, format: uuid }
                notes: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      quantity: { type: number }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_SOURCE_DESTINATION_SAME", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/transfers/{transferId}/submit:
    post:
      tags: [Warehouse]
      summary: Submit a draft transfer for approval
      x-permission: warehouse.stock.transfer
      parameters: [{ name: transferId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_TRANSFER_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/transfers/{transferId}/approve:
    post:
      tags: [Warehouse]
      summary: Approve a submitted transfer (maker-checker -- approver cannot be the requester)
      x-permission: warehouse.stock.transfer
      parameters: [{ name: transferId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_SEGREGATION_OF_DUTIES (self-approval) or WHS_TRANSFER_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/transfers/{transferId}/dispatch:
    post:
      tags: [Warehouse]
      summary: Dispatch an approved transfer -- decrements source warehouse stock
      x-permission: warehouse.stock.transfer
      parameters: [{ name: transferId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "WHS_STOCK_INSUFFICIENT", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "WHS_TRANSFER_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/transfers/{transferId}/receive:
    post:
      tags: [Warehouse]
      summary: Receive a dispatched transfer -- increments destination warehouse stock
      x-permission: warehouse.stock.transfer
      parameters: [{ name: transferId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "WHS_DUPLICATE_MOVEMENT -- transfer already received", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "WHS_TRANSFER_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/adjustments:
    post:
      tags: [Warehouse]
      summary: Create a stock adjustment (draft; stock is unaffected until Post)
      x-permission: warehouse.stock.adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, direction, reasonCode, items]
              properties:
                warehouseId: { type: string, format: uuid }
                direction: { type: string, enum: [IN, OUT] }
                reasonCode: { type: string, example: "DAMAGED" }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      quantity: { type: number }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warehouse/adjustments/{adjustmentId}/approve:
    post:
      tags: [Warehouse]
      summary: Approve a draft adjustment (maker-checker -- approver cannot be the requester)
      x-permission: warehouse.stock.adjust
      parameters: [{ name: adjustmentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_SEGREGATION_OF_DUTIES (self-approval) or WHS_ADJUSTMENT_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/adjustments/{adjustmentId}/post:
    post:
      tags: [Warehouse]
      summary: Post an approved adjustment -- the transaction boundary that writes the stock ledger (a stricter permission tier than Create/Approve)
      x-permission: warehouse.stock.adjust.post
      parameters: [{ name: adjustmentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: "WHS_ADJUSTMENT_APPROVAL_REQUIRED -- must be approved before it can be posted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "WHS_DUPLICATE_MOVEMENT -- adjustment already posted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "WHS_NEGATIVE_STOCK_FORBIDDEN -- an OUT adjustment would drive stock negative", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/reservations:
    post:
      tags: [Warehouse]
      summary: Reserve stock against a reference document (UC-WHS-007) -- affects reservedStock/availableStock only, never currentStock
      x-permission: warehouse.stock.reserve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, itemId, quantity, referenceType, referenceId]
              properties:
                warehouseId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                quantity: { type: number }
                referenceType: { type: string, example: "TREATMENT_PLAN" }
                referenceId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "WHS_STOCK_INSUFFICIENT", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/reservations/{reservationId}/release:
    post:
      tags: [Warehouse]
      summary: Release a stock reservation, returning its quantity to available stock (idempotent -- releasing an already-released reservation is a no-op)
      x-permission: warehouse.stock.reserve
      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warehouse/stock-opnames:
    get:
      tags: [Warehouse]
      summary: List stock opnames
      x-permission: warehouse.opname.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, COUNTING, SUBMITTED, APPROVED, POSTED, REJECTED] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Warehouse]
      summary: Create a draft stock opname scoped to the given itemIds (UC-WHS-006 step 1)
      x-permission: warehouse.opname.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, opnameDate, items]
              properties:
                warehouseId: { type: string, format: uuid }
                opnameDate: { type: string, format: date }
                notes: { type: string }
                items:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: "WHS_OPNAME_ALREADY_ACTIVE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/stock-opnames/{opnameId}:
    parameters:
      - name: opnameId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Warehouse]
      summary: Stock opname detail (with line items, system/physical/variance)
      x-permission: warehouse.opname.read
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Warehouse]
      summary: Update a draft opname's scope/notes (rejected once counting has started)
      x-permission: warehouse.opname.create
      requestBody: { $ref: '#/components/requestBodies/GenericJson' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_OPNAME_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/stock-opnames/{opnameId}/start-count:
    post:
      tags: [Warehouse]
      summary: Freeze the system quantity snapshot and transition the opname to counting
      x-permission: warehouse.opname.count
      parameters: [{ name: opnameId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_OPNAME_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/stock-opnames/{opnameId}/submit:
    post:
      tags: [Warehouse]
      summary: Submit physical counts for approval; computes variance (physical - system) per line
      x-permission: warehouse.opname.count
      parameters: [{ name: opnameId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, physicalQuantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      physicalQuantity: { type: number }
                      notes: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_OPNAME_INVALID_STATUS or WHS_OPNAME_ITEM_NOT_IN_SCOPE", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/stock-opnames/{opnameId}/approve:
    post:
      tags: [Warehouse]
      summary: Approve the counted variance (maker-checker -- approver cannot be the requester)
      x-permission: warehouse.opname.approve
      parameters: [{ name: opnameId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_SEGREGATION_OF_DUTIES (self-approval) or WHS_OPNAME_INVALID_STATUS", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/stock-opnames/{opnameId}/post:
    post:
      tags: [Warehouse]
      summary: Post the variance to the stock ledger (one OPNAME transaction per non-zero-variance line) -- a stricter permission tier than Create/Count/Approve
      x-permission: warehouse.opname.post
      parameters: [{ name: opnameId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "WHS_DUPLICATE_MOVEMENT -- opname already posted", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
        '422': { description: "WHS_OPNAME_INVALID_STATUS or WHS_NEGATIVE_STOCK_FORBIDDEN", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/batches:
    get:
      tags: [Warehouse]
      summary: List item batches (FEFO/expiry tracking)
      x-permission: warehouse.batch.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, QUARANTINED, EXPIRED, DEPLETED] }
        - name: expiryFrom
          in: query
          schema: { type: string, format: date }
        - name: expiryTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /warehouse/batches/{batchId}/quarantine:
    post:
      tags: [Warehouse]
      summary: Quarantine an active batch -- removes its quantity from availableStock (via reservedStock) without affecting currentStock, so FEFO consumption can no longer select it
      x-permission: warehouse.batch.quarantine
      parameters: [{ name: batchId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: "WHS_BATCH_INVALID_STATUS -- only an active batch can be quarantined", content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }

  /warehouse/reports/stock-card:
    get:
      tags: [Warehouse]
      summary: "Stock card report -- immutable in/out/balance ledger for one item/warehouse pair over a period"
      x-permission: warehouse.report.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /warehouse/reports/stock-balance:
    get:
      tags: [Warehouse]
      summary: "Stock balance report -- current, reserved, available, minimum, status"
      x-permission: warehouse.report.read
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /warehouse/reports/movements:
    get:
      tags: [Warehouse]
